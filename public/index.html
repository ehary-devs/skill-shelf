<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Shelf</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <h1>Skill Shelf</h1>
      <p class="sub" id="sub">Memuat inventaris…</p>
    </div>
    <div class="top-actions">
      <button id="refresh" class="btn" type="button" title="Pindai ulang folder skill dan riwayat sesi">Pindai ulang</button>
      <button id="theme" class="btn icon" type="button" aria-label="Ganti tema terang/gelap">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.75a7.25 7.25 0 0 1 0 14.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-label="Ringkasan rak">
    <h2 class="lede" id="lede">&nbsp;</h2>
    <p class="lede-sub" id="lede-sub"></p>
    <div class="shelf" id="shelf" role="list" aria-label="Semua skill, tinggi sesuai jumlah pemakaian"></div>
    <div class="legend" id="legend"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" class="tab" data-tab="skills" aria-selected="true">Skill</button>
    <button role="tab" class="tab" data-tab="agents" aria-selected="false">Agent</button>
    <button role="tab" class="tab" data-tab="activity" aria-selected="false">Aktivitas</button>
  </nav>

  <section id="view-skills" class="view">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Cari nama, deskripsi, atau sumber" autocomplete="off">
      <select id="sort" aria-label="Urutkan">
        <option value="uses">Paling sering dipakai</option>
        <option value="last">Terakhir dipakai</option>
        <option value="name">Nama A–Z</option>
        <option value="size">Ukuran SKILL.md</option>
      </select>
    </div>
    <div class="filters">
      <div class="chips" id="chips-group" aria-label="Filter sumber"></div>
      <div class="chips" id="chips-agent" aria-label="Filter agent"></div>
    </div>
    <p class="count" id="count"></p>
    <div class="list" id="grid"></div>
  </section>

  <section id="view-agents" class="view" hidden>
    <div class="list" id="agent-grid"></div>
  </section>

  <section id="view-activity" class="view" hidden>
    <div class="panel">
      <h2>Pemakaian per hari</h2>
      <p class="muted small">Dihitung dari transkrip Claude Code di <code>~/.claude/projects</code>. Antigravity dan OpenCode belum tercatat.</p>
      <div id="chart" class="chart"></div>
    </div>
    <div class="two">
      <div class="panel"><h2>Skill teratas</h2><ol id="top-skills" class="rank-list"></ol></div>
      <div class="panel"><h2>Agent teratas</h2><ol id="top-agents" class="rank-list"></ol></div>
    </div>
    <div class="panel">
      <h2>Belum pernah dipakai</h2>
      <p class="muted small">Kandidat untuk dihapus kalau memang tidak dibutuhkan.</p>
      <div id="unused" class="tag-cloud"></div>
    </div>
  </section>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <button class="btn icon close" type="button" data-close aria-label="Tutup">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
    <div id="d-body"></div>
  </aside>
</div>

<div id="tip" class="tip" hidden></div>
<script src="/app.js"></script>
</body>
</html>
